services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mytutor
      POSTGRES_PASSWORD: mytutor
      POSTGRES_DB: mytutor
    ports:
      - '5432:5432'
    volumes:
      - mytutor-db:/var/lib/postgresql/data
      - ./scripts/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mytutor -d mytutor']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mytutor-db:
