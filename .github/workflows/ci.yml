name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://mytutor:mytutor@localhost:5432/mytutor?schema=public
  TEST_DATABASE_URL: postgresql://mytutor:mytutor@localhost:5432/mytutor_test?schema=public
  E2E_DATABASE_URL: postgresql://mytutor:mytutor@localhost:5432/mytutor_e2e?schema=public
  SESSION_SECRET: ci-only-session-secret-value-not-used-anywhere-else

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mytutor
          POSTGRES_PASSWORD: mytutor
          POSTGRES_DB: mytutor
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mytutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Create test databases
        run: |
          PGPASSWORD=mytutor psql -h localhost -U mytutor -d mytutor -c 'CREATE DATABASE mytutor_test;'
          PGPASSWORD=mytutor psql -h localhost -U mytutor -d mytutor -c 'CREATE DATABASE mytutor_e2e;'

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build shared contracts
        run: npm run build -w @mytutor/contracts

      - name: Typecheck
        run: npm run typecheck

      - name: Verify migrations apply to an empty database
        run: npm run db:migrate:deploy

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (PostgreSQL)
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
